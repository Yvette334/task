<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-300 min-h-screen">
    <header class="bg-blue-600 shadow-lg text-center">
      <div class="container mx-auto px-4 py-3">
        <h1 class="font-bold text-3xl">Task Management System</h1>
        <p class="mt-2">Organize your task efficiently</p>
      </div>
    </header>
    <main class="container mx-auto py-8">
      <div class="bg-white rounded-lg shadow-md p-6 mb-8 mx-auto max-w-2xl">
        <form class="text-center" id="taskform">
          <h2 class="font-bold text-2xl mb-6">Add New Task</h2>
          <h3 class="font-semibold mb-2 text-left">Task Name</h3>
          <input
            id="taskname"
            class="w-full px-3 py-2 border rounded-lg"
            type="text"
            placeholder="Enter your Task"
            required
          />
          <h3 class="font-semibold mb-2 text-left">Due Date</h3>
          <input
            id="date"
            type="date"
            class="w-full px-3 py-2 border rounded-lg"
          />
          <button
            type="submit"
            id="button"
            class="bg-blue-600 py-3 px-5 font-semibold mt-6 rounded-lg"
          >
            Add Task
          </button>
        </form>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6 mb-8 mx-auto max-w-2xl">
        <h2 id="task" class="text-2xl font-semibold mb-4 flex">Your Task</h2>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
